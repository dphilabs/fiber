name: "Fiber CI/CD Pipeline"

on:
  push:
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-e2e-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Fiber Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Compatibility Fixtures (fiber-compats)
        uses: actions/checkout@v4
        with:
          repository: dphilabs/fiber-compats
          path: fiber-compats

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Cloudflare Wrangler
        run: npm install -g wrangler

      - name: Install Python Dependencies
        run: |
          pip install uv hatch
          uv pip install --system -e .[dev]

      - name: Bootstrap Workspace & Node Identity
        run: |
          fiber init

      - name: Boot Node & Embedded Valkey (Background)
        env:
          XPHI_ENV: "local"
          XPHI_WORKERS: "2"
          XPHI_TUNNEL_URL: "redis://127.0.0.1:6379"
        run: |
          echo "Starting Node (with embedded Valkey unix socket) in background..."
          nohup python -u -m xphi.node.ops.boot > node_boot.log 2>&1 &
          echo "NODE_PID=$!" >> $GITHUB_ENV

          echo "Waiting for Node to become ready on port 8356..."
          timeout 30 bash -c 'while ! curl -s http://127.0.0.1:8356/v1/compliance/keys > /dev/null; do sleep 1; done'
          echo "Node is fully up and running!"

      - name: Run Wasm & Plane Infrastructure
        run: |
          fiber e2e infra.wasm.gateway
          fiber e2e infra.wasm.fsm
          fiber e2e infra.plane.flare --mode dev

      - name: Run Gateway & FinOps Interceptors
        env:
          XPHI_ENV: "local"
        run: |
          fiber e2e gateway.compliance
          fiber e2e gateway.security
          fiber e2e inter.finops --vcr replay

      - name: Run Semantic Router (VCR)
        env:
          VCR_MODE: replay
          FIBER_COMPATS_DIR: ${{ github.workspace }}/fiber-compats
        run: |
          pytest -v -s llm/pipeline/interceptor/tests/router.py

      - name: Run Concurrency & Load Benchmark
        run: |
          fiber e2e inter.concurrency --vcr replay --concurrency 50

      - name: Teardown Node & Embedded Valkey (Reaper)
        if: always()
        env:
          XPHI_ENV: "ci"
        run: |
          echo "Executing Node Reaper..."
          python -m xphi.node.ops.reaper

          if kill -0 ${{ env.NODE_PID }} 2>/dev/null; then
            echo "Reaper did not terminate the process. Forcing kill..."
            kill ${{ env.NODE_PID }} || true
          fi
          echo "Node and embedded Valkey reaped cleanly."

      - name: Upload Node Boot Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-error-logs
          path: node_boot.log