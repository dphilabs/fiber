<!DOCTYPE html>
<html lang="ko" data-theme="doc">
<head>
<meta charset="utf-8">
<title>runbook viewer</title>
<!-- Runbook viewer: view model JSON -> HTML. Standalone; console embeds it in an iframe.
     Entry: window.__VIEWER__ = { render, patch, applyEvent, setTheme, report }.
     Channel: postMessage({type: "model"|"patch"|"event"|"theme", seq, payload}). -->
<style>
  :root, [data-theme="doc"] {
    --bg: #f1f5f9; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #cbd5e1;
    --accent: #2563eb; --soft: #eff6ff; --head: #f8fafc;
    --ok: #16a34a; --fail: #dc2626; --run: #2563eb; --wait: #64748b; --dry: #d97706;
    --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, sans-serif;
    --radius: 6px;
  }
  [data-theme="tui"] {
    --bg: #090a0f; --card: #0d0f17; --ink: #d8dee9; --muted: #6c7689; --line: #262b3d;
    --accent: #7dcfff; --soft: #050608; --head: #050608;
    --ok: #50fa7b; --fail: #f7768e; --run: #7dcfff; --wait: #6c7689; --dry: #e0af68;
    --font: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
    --radius: 0;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.5 var(--font); padding: 14px; }
  .doc { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  h1 { font-size: 15px; font-weight: 700; margin-bottom: 8px; word-break: break-all; }
  .stages { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11px; margin-bottom: 12px; color: var(--muted); }
  .stages .done { color: var(--ok); }
  .stages .cur { color: var(--accent); font-weight: 700; }
  .stages .sep { opacity: 0.55; font-size: 9px; }
  .block { margin-top: 12px; break-inside: avoid; }
  .block-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .para { color: var(--ink); white-space: pre-line; }
  .callout { padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-weight: 600; word-break: break-word; }
  .callout.t-ok { border-color: var(--ok); color: var(--ok); }
  .callout.t-fail { border-color: var(--fail); color: var(--fail); }
  .callout.t-dry { border-color: var(--dry); color: var(--dry); }
  .callout.t-none, .callout.t-wait { border-color: var(--wait); color: var(--muted); }
  .table-wrap { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--muted); background: var(--head); border-bottom: 1px solid var(--line); padding: 4px 8px; white-space: nowrap; }
  td { border-bottom: 1px solid var(--line); padding: 4px 8px; vertical-align: top; word-break: break-word; }
  td.empty-cell { color: var(--muted); text-align: center; padding: 8px; }
  ol.flow, ol.timeline { list-style: none; }
  ol.flow li, ol.timeline li { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .num { color: var(--muted); width: 22px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .label { font-weight: 700; min-width: 150px; flex-shrink: 0; }
  .detail, .note { color: var(--muted); flex: 1; min-width: 0; word-break: break-word; }
  .st { font-size: 11px; min-width: 48px; flex-shrink: 0; }
  .st-ok { color: var(--ok); } .st-fail { color: var(--fail); } .st-run { color: var(--run); }
  .st-wait, .st-none { color: var(--wait); } .st-dry { color: var(--dry); }
  .tag { font-size: 11px; border: 1px solid var(--line); padding: 0 5px; color: var(--accent); flex-shrink: 0; }
  pre.code {
    background: var(--soft); border: 1px solid var(--line); padding: 8px 10px;
    font: 12px/1.5 "JetBrains Mono", "Fira Code", ui-monospace, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .compare > div { border: 1px solid var(--line); background: var(--soft); padding: 8px 10px; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
  .compare b { display: block; margin-bottom: 4px; color: var(--accent); }
  .empty { color: var(--muted); padding: 20px 0; }
  @page { margin: 12mm; }
  @media print {
    :root, [data-theme="tui"], [data-theme="doc"] {
      --bg: #ffffff; --card: #ffffff; --ink: #0f172a; --muted: #475569; --line: #cbd5e1;
      --accent: #1d4ed8; --soft: #f8fafc; --head: #f1f5f9;
      --ok: #15803d; --fail: #b91c1c; --run: #1d4ed8; --wait: #64748b; --dry: #b45309;
    }
    body { background: #ffffff; padding: 0; }
    .doc { border: none; padding: 0; }
  }
</style>
</head>
<body>
<div class="doc" id="root"><div class="empty">no model</div></div>
<script id="model-data" type="application/json">/*__MODEL__*/null</script>
<script>
(function () {
  const STAGES = ["template", "draft", "dryrun", "pinned", "run"];
  const STAGE_LABEL = {
    template: "TEMPLATE",
    draft: "DRAFT",
    dryrun: "DRY RUN",
    pinned: "PINNED",
    run: "TRIGGER",
  };
  const STAGE_ALIAS = { pin: "pinned", trigger: "run" };

  const root = document.getElementById("root");
  let currentModel = null;
  let lastSeq = -1;
  let lastReport = { flow: null, version: null, blocks: 0, errors: [] };

  // Apply `?theme=tui|doc` when opened standalone via URL
  const urlTheme = new URLSearchParams(window.location.search).get("theme");
  if (urlTheme === "tui" || urlTheme === "doc") {
    document.documentElement.setAttribute("data-theme", urlTheme);
  }

  function esc(v) {
    const d = document.createElement("div");
    d.textContent = v == null ? "" : String(v);
    return d.innerHTML;
  }

  function st(status) {
    const norm = String(status || "none").toLowerCase();
    return `<span class="st st-${esc(norm)}">[${esc(norm.toUpperCase())}]</span>`;
  }

  function splitStepLabel(rawLabel, fallbackIdx) {
    const text = String(rawLabel || "").trim();
    const m = /^(\d{2,3})\s+(.+)$/.exec(text);
    if (m) return { no: m[1], name: m[2] };
    return { no: String(fallbackIdx + 1).padStart(2, "0"), name: text };
  }

  const KINDS = {
    paragraph: (b) => `<p class="para">${esc(b.text)}</p>`,
    callout: (b) => `<div class="callout t-${esc(b.tone || "run")}">${esc(b.text)}</div>`,
    table: (b) => {
      const headers = b.headers || [];
      const rows = b.rows || [];
      const headHtml = headers.length
        ? `<thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead>`
        : "";
      const bodyHtml = rows.length
        ? rows.map((r) => `<tr>${(Array.isArray(r) ? r : [r]).map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")
        : `<tr><td class="empty-cell" colspan="${Math.max(1, headers.length)}">(empty)</td></tr>`;
      return `<div class="table-wrap"><table>${headHtml}<tbody>${bodyHtml}</tbody></table></div>`;
    },
    flow: (b) => `<ol class="flow">${(b.steps || []).map((s, i) => {
      const sp = splitStepLabel(s.label, i);
      const no = s.no ? String(s.no) : sp.no;
      const lbl = s.no ? String(s.label || "") : sp.name;
      return `<li><span class="num">${esc(no)}</span><span class="label">${esc(lbl)}</span>${st(s.status)}` +
        `<span class="detail">${esc(s.detail || "")}</span></li>`;
    }).join("")}</ol>`,
    timeline: (b) => `<ol class="timeline">${(b.events || []).map((e) => {
      const sp = splitStepLabel(e.node, 0);
      const hasLeadingNo = /^\d{2,3}\s+/.test(String(e.node || "").trim());
      const numCol = hasLeadingNo ? `<span class="num">${esc(sp.no)}</span>` : "";
      const nodeLbl = hasLeadingNo ? sp.name : String(e.node || "");
      return `<li>${numCol}<span class="label">${esc(nodeLbl)}</span>${st(e.status)}` +
        (e.tag ? `<span class="tag">${esc(e.tag)}</span>` : "") +
        `<span class="note">${esc([e.dur, e.note].filter(Boolean).join(" · "))}</span></li>`;
    }).join("")}</ol>`,
    code: (b) => `<pre class="code" data-lang="${esc(b.lang || "")}">${esc(b.text)}</pre>`,
    compare: (b) => {
      const left = b.left || { heading: "before", body: "" };
      const right = b.right || { heading: "after", body: "" };
      return `<div class="compare"><div><b>${esc(left.heading)}</b>${esc(left.body)}</div>` +
        `<div><b>${esc(right.heading)}</b>${esc(right.body)}</div></div>`;
    },
  };

  function stagesHtml(rawStage) {
    const stage = STAGE_ALIAS[rawStage] || rawStage || "";
    const idx = STAGES.indexOf(stage);
    return STAGES.map((s, i) => {
      const cls = idx >= 0 ? (i < idx ? "done" : i === idx ? "cur" : "") : "";
      const sep = i < STAGES.length - 1
        ? `<span class="sep">${s === "pinned" ? "&#9655;" : "&#9654;"}</span>`
        : "";
      return `<span class="${cls}">${STAGE_LABEL[s]}</span>${sep}`;
    }).join("");
  }

  function notifyReport() {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage(
          { type: "report", flow: lastReport.flow, version: lastReport.version, seq: lastSeq, payload: lastReport },
          "*"
        );
      } catch (_) {}
    }
  }

  function render(model) {
    const errors = [];
    if (!model || typeof model !== "object") {
      currentModel = null;
      root.innerHTML = `<div class="empty">no model</div>`;
      lastReport = { flow: null, version: null, blocks: 0, errors: [] };
      return lastReport;
    }
    currentModel = JSON.parse(JSON.stringify(model));
    const blocks = (currentModel.blocks || []).map((b, i) => {
      if (!b || !KINDS[b.kind]) {
        errors.push(`unknown kind '${b && b.kind}' at ${i}`);
        return "";
      }
      const title = b.title ? `<div class="block-title">${esc(b.title)}</div>` : "";
      return `<section class="block" data-idx="${i}">${title}${KINDS[b.kind](b)}</section>`;
    }).join("");
    const bodyHtml = blocks || `<div class="empty">(no blocks)</div>`;
    root.innerHTML =
      `<h1>${esc(currentModel.title || currentModel.flow || "runbook")}</h1>` +
      `<div class="stages">${stagesHtml(currentModel.stage)}</div>` +
      bodyHtml;
    lastReport = {
      flow: currentModel.flow || null,
      version: currentModel.version ?? null,
      blocks: (currentModel.blocks || []).length,
      errors,
    };
    return lastReport;
  }

  function patch(partial) {
    if (!partial || typeof partial !== "object") return lastReport;
    if (!currentModel) return render(partial);
    const next = Object.assign({}, currentModel, partial);
    if (Array.isArray(partial.blockPatches) && Array.isArray(currentModel.blocks)) {
      const cloned = currentModel.blocks.slice();
      for (const p of partial.blockPatches) {
        if (p && typeof p.index === "number" && p.block) cloned[p.index] = p.block;
      }
      next.blocks = cloned;
      delete next.blockPatches;
    }
    return render(next);
  }

  function applyEvent(ev) {
    if (!currentModel || !ev) return lastReport;
    const blocks = Array.isArray(currentModel.blocks) ? currentModel.blocks.slice() : [];
    let tlIdx = blocks.findIndex((b) => b && b.kind === "timeline");
    if (tlIdx < 0) {
      blocks.push({ kind: "timeline", title: "trace", events: [ev] });
    } else {
      const evs = Array.isArray(blocks[tlIdx].events) ? blocks[tlIdx].events.slice() : [];
      const pos = evs.findIndex((x) => x && x.node === ev.node);
      if (pos >= 0) evs[pos] = Object.assign({}, evs[pos], ev);
      else evs.push(ev);
      blocks[tlIdx] = Object.assign({}, blocks[tlIdx], { events: evs });
    }
    return render(Object.assign({}, currentModel, { blocks }));
  }

  function setTheme(theme) {
    if (theme === "tui" || theme === "doc") {
      document.documentElement.setAttribute("data-theme", theme);
    }
  }

  window.__VIEWER__ = { render, patch, applyEvent, setTheme, report: () => lastReport };

  window.addEventListener("message", (e) => {
    const m = e.data;
    if (!m || typeof m !== "object" || !m.type) return;
    if (typeof m.seq === "number") {
      if (m.type !== "model" && m.seq <= lastSeq) return;
      lastSeq = m.seq;
    }
    if (m.type === "model") {
      render(m.payload);
      notifyReport();
    } else if (m.type === "patch") {
      patch(m.payload);
      notifyReport();
    } else if (m.type === "event") {
      applyEvent(m.payload);
    } else if (m.type === "theme") {
      setTheme(m.payload);
    }
  });

  try {
    const raw = document.getElementById("model-data").textContent;
    render(JSON.parse(raw));
  } catch (err) {
    lastReport = { flow: null, version: null, blocks: 0, errors: [String(err)] };
  }
})();
</script>
</body>
</html>
